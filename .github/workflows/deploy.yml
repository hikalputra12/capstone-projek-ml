name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Hapus folder .git bawaan GitHub untuk membersihkan riwayat lama
          rm -rf .git
          
          # Inisialisasi Git baru yang benar-benar bersih
          git init
          git checkout -b main
          
          # Konfigurasi Git
          git config --global user.email "deploy-bot@example.com"
          git config --global user.name "Deploy Bot"
          
          # Tambahkan semua file saat ini (disaring oleh .gitignore baru)
          git add .
          git commit -m "Deploy: clean upload without binary history"
          
          # Push ke Hugging Face Space
          git remote add hf https://Hero1012:$HF_TOKEN@huggingface.co/spaces/Hero1012/brainpath-ai-engine
          git push --force hf main